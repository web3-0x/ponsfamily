[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Required: the launch factory and the v4 hook both exceed the legacy
# pipeline's 16-slot stack window ("Stack too deep") without it.
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "@uniswap/v4-hooks-public/=lib/v4-hooks-public/",
    "permit2/=lib/v4-periphery/lib/permit2/",
]

[fmt]
line_length = 120
tab_width = 4
